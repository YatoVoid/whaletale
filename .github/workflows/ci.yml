name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        # Gate covers the defensible logic (zones, counter, config, decode
        # helper, tracker). Raise it as later milestones add testable surface.
        run: uv run pytest --cov=agent --cov-report=term-missing --cov-fail-under=70

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whaletale
          POSTGRES_PASSWORD: whaletale
          POSTGRES_DB: whaletale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whaletale"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://whaletale:whaletale@localhost:5432/whaletale
      WHALETALE_TEST_DATABASE_URL: postgresql+psycopg://whaletale:whaletale@localhost:5432/whaletale
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: alembic upgrade + autogenerate check
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: pytest
        run: uv run pytest --cov=whaletale_cloud --cov=schemas --cov-report=term-missing --cov-fail-under=80

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: audit edge dependencies for AGPL/GPL
        run: |
          cd edge
          uv sync --frozen
          uv run python ../scripts/license_audit.py
      - name: audit cloud dependencies for AGPL/GPL
        run: |
          cd cloud
          uv sync --frozen
          uv run python ../scripts/license_audit.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
