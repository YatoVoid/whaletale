<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="424" viewBox="0 0 1024 424" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1024" height="424" fill="#f6f5f1"/>
  <rect x="0" y="0" width="1024" height="34" fill="#fbfaf7"/>
  <line x1="0" y1="34" x2="1024" y2="34" stroke="#d7d3c8"/>
  <circle cx="20" cy="17" r="4" fill="none" stroke="#d7d3c8"/><circle cx="36" cy="17" r="4" fill="none" stroke="#d7d3c8"/><circle cx="52" cy="17" r="4" fill="none" stroke="#d7d3c8"/>
  <text x="76" y="21" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#5c584e">console.whaletale.local  /spaces/rosas-tamales/zone</text>

  <line x1="150" y1="34" x2="150" y2="424" stroke="#d7d3c8"/>
  <text x="20" y="66" font-family="DejaVu Serif, Noto Serif, serif" font-size="17" fill="#1b1a16">WhaleTale</text>
  <text x="20" y="82" font-size="10.5" fill="#5c584e">Cedar Street Market</text>
  <text x="20" y="114" font-size="12" fill="#5c584e">Overview</text>
  <text x="20" y="144" font-size="12" fill="#5c584e">Schedule</text>
  <rect x="10" y="156" width="130" height="24" fill="#2f4f4f" fill-opacity="0.10"/>
  <text x="20" y="172" font-size="12" fill="#1b1a16">Spaces</text>
  <text x="20" y="202" font-size="12" fill="#5c584e">Occupants</text>
  <text x="20" y="228" font-size="12" fill="#5c584e">Reports</text>
  <text x="20" y="254" font-size="12" fill="#5c584e">Settings</text>

  <text x="184" y="72" font-family="DejaVu Serif, Noto Serif, serif" font-size="20" fill="#1b1a16">Zone · Stall 1</text>
  <text x="184" y="92" font-size="10.5" fill="#5c584e">Click to add a point, drag to move, double-click to delete. Points snap. Coordinates are normalized.</text>

  <!-- canvas 184..624 x, 110..358 y (440 x 248, ~16:9) -->
  <rect x="184" y="110" width="440" height="248" fill="#fbfaf7" stroke="#d7d3c8"/>
  <g stroke="#d7d3c8" stroke-width="0.8">
    <line x1="294" y1="110" x2="294" y2="358"/><line x1="404" y1="110" x2="404" y2="358"/><line x1="514" y1="110" x2="514" y2="358"/>
    <line x1="184" y1="192" x2="624" y2="192"/><line x1="184" y1="276" x2="624" y2="276"/>
  </g>
  <polygon points="290,160 500,160 540,320 250,320" fill="#2f4f4f" fill-opacity="0.16" stroke="#2f4f4f" stroke-width="1.6"/>
  <g fill="#2f4f4f" stroke="#f6f5f1" stroke-width="1.4">
    <circle cx="290" cy="160" r="5"/><circle cx="500" cy="160" r="5"/><circle cx="540" cy="320" r="5"/><circle cx="250" cy="320" r="5"/>
  </g>

  <!-- side -->
  <rect x="648" y="112" width="60" height="24" fill="none" stroke="#d7d3c8"/><text x="678" y="128" font-size="10" fill="#1b1a16" text-anchor="middle">Undo</text>
  <rect x="716" y="112" width="60" height="24" fill="none" stroke="#d7d3c8"/><text x="746" y="128" font-size="10" fill="#1b1a16" text-anchor="middle">Redo</text>
  <text x="788" y="129" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#5c584e">4 points</text>
  <text x="648" y="168" font-size="10.5" fill="#5c584e">Save creates version 3.</text>
  <text x="648" y="186" font-size="10.5" fill="#5c584e">Reports before today keep version 2;</text>
  <text x="648" y="204" font-size="10.5" fill="#5c584e">geometry is never edited in place.</text>
  <text x="648" y="242" font-size="10.5" fill="#b23a26">This zone overlaps Patio 1 on the</text>
  <text x="648" y="260" font-size="10.5" fill="#b23a26">same camera. Set a parent/child</text>
  <text x="648" y="278" font-size="10.5" fill="#b23a26">relation, or "Save with the overlap".</text>
  <rect x="648" y="298" width="150" height="26" fill="none" stroke="#b23a26"/>
  <text x="723" y="315" font-size="10" fill="#b23a26" text-anchor="middle">Save with the overlap</text>

  <text x="184" y="406" font-size="10" fill="#5c584e" font-style="italic">Rendering of the zone editor. Fewer than three points, a self-intersecting shape, or points outside the frame are refused.</text>
</svg>
