<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="470" viewBox="0 0 1024 470" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#d7d3c8" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="1024" height="470" fill="#f6f5f1"/>
  <rect x="0" y="0" width="1024" height="34" fill="#fbfaf7"/>
  <line x1="0" y1="34" x2="1024" y2="34" stroke="#d7d3c8"/>
  <circle cx="20" cy="17" r="4" fill="none" stroke="#d7d3c8"/><circle cx="36" cy="17" r="4" fill="none" stroke="#d7d3c8"/><circle cx="52" cy="17" r="4" fill="none" stroke="#d7d3c8"/>
  <text x="76" y="21" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#5c584e">console.whaletale.local  /schedule</text>

  <line x1="150" y1="34" x2="150" y2="470" stroke="#d7d3c8"/>
  <text x="20" y="66" font-family="DejaVu Serif, Noto Serif, serif" font-size="17" fill="#1b1a16">WhaleTale</text>
  <text x="20" y="82" font-size="10.5" fill="#5c584e">Cedar Street Market</text>
  <text x="20" y="114" font-size="12" fill="#5c584e">Overview</text>
  <rect x="10" y="126" width="130" height="24" fill="#2f4f4f" fill-opacity="0.10"/>
  <text x="20" y="142" font-size="12" fill="#1b1a16">Schedule</text>
  <text x="20" y="170" font-size="12" fill="#5c584e">Spaces</text>
  <text x="20" y="196" font-size="12" fill="#5c584e">Occupants</text>
  <text x="20" y="222" font-size="12" fill="#5c584e">Reports</text>
  <text x="20" y="248" font-size="12" fill="#5c584e">Settings</text>

  <text x="184" y="74" font-family="DejaVu Serif, Noto Serif, serif" font-size="25" fill="#1b1a16">Schedule</text>
  <text x="184" y="94" font-size="11.5" fill="#5c584e">Jun 2 – Jun 15. Click a cell, shift-click a block, then assign an occupant.</text>

  <!-- grid: label col 184..300, 10 days across 300..960 (66 wide), rows 120..390 (45 tall) -->
  <g font-size="10" fill="#5c584e" text-anchor="middle">
    <text x="333" y="132">M 2</text><text x="399" y="132">T 3</text><text x="465" y="132">W 4</text><text x="531" y="132">T 5</text><text x="597" y="132">F 6</text><text x="663" y="132">S 7</text><text x="729" y="132">S 8</text><text x="795" y="132">M 9</text><text x="861" y="132">T 10</text><text x="927" y="132">W 11</text>
  </g>
  <g font-size="11" fill="#1b1a16">
    <text x="184" y="163">Stall 1</text><text x="184" y="208">Stall 2</text><text x="184" y="253">Stall 3</text><text x="184" y="298">Stall 4</text><text x="184" y="343">Stall 5</text><text x="184" y="388">Stall 6</text>
  </g>

  <!-- filled cells -->
  <g fill="#2f4f4f" fill-opacity="0.14">
    <!-- Stall 1 all -->
    <rect x="300" y="140" width="660" height="43"/>
    <!-- Stall 2 all -->
    <rect x="300" y="185" width="660" height="43"/>
    <!-- Stall 3 Sat only (col 6 = x 630) -->
    <rect x="630" y="230" width="66" height="43"/>
    <!-- Stall 4 cols 1-4 -->
    <rect x="300" y="275" width="264" height="43"/>
  </g>
  <!-- Stall 6 all vacant -->
  <rect x="300" y="365" width="660" height="43" fill="url(#hatch)"/>
  <!-- Stall 5 cols 1-3 selected -->
  <rect x="301" y="321" width="197" height="41" fill="#2f4f4f" fill-opacity="0.06" stroke="#1b1a16" stroke-width="2"/>

  <!-- grid lines -->
  <g stroke="#d7d3c8" stroke-width="1">
    <line x1="300" y1="140" x2="300" y2="408"/>
    <line x1="366" y1="140" x2="366" y2="408"/><line x1="432" y1="140" x2="432" y2="408"/><line x1="498" y1="140" x2="498" y2="408"/><line x1="564" y1="140" x2="564" y2="408"/><line x1="630" y1="140" x2="630" y2="408"/><line x1="696" y1="140" x2="696" y2="408"/><line x1="762" y1="140" x2="762" y2="408"/><line x1="828" y1="140" x2="828" y2="408"/><line x1="894" y1="140" x2="894" y2="408"/><line x1="960" y1="140" x2="960" y2="408"/>
    <line x1="184" y1="140" x2="960" y2="140"/><line x1="184" y1="185" x2="960" y2="185"/><line x1="184" y1="230" x2="960" y2="230"/><line x1="184" y1="275" x2="960" y2="275"/><line x1="184" y1="320" x2="960" y2="320"/><line x1="184" y1="365" x2="960" y2="365"/><line x1="184" y1="408" x2="960" y2="408"/>
  </g>

  <text x="184" y="436" font-size="10" fill="#5c584e">Assign panel: permanent · recurring (a weekday picker builds FREQ=WEEKLY;BYDAY=SA) · one-off. A conflicting range names both tenancies.</text>
  <text x="184" y="456" font-size="10" fill="#5c584e" font-style="italic">Rendering of the operator console. Stall 3 is a Saturday-only stand; Stall 6 is vacant (hatched, a state, not a gap).</text>
</svg>
