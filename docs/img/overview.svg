<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#d7d3c8" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="1024" height="500" fill="#f6f5f1"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1024" height="34" fill="#fbfaf7"/>
  <line x1="0" y1="34" x2="1024" y2="34" stroke="#d7d3c8"/>
  <circle cx="20" cy="17" r="4" fill="none" stroke="#d7d3c8"/>
  <circle cx="36" cy="17" r="4" fill="none" stroke="#d7d3c8"/>
  <circle cx="52" cy="17" r="4" fill="none" stroke="#d7d3c8"/>
  <text x="76" y="21" font-family="Noto Sans Mono, DejaVu Sans Mono, monospace" font-size="11" fill="#5c584e">console.whaletale.local  /</text>

  <!-- left rail -->
  <line x1="150" y1="34" x2="150" y2="500" stroke="#d7d3c8"/>
  <text x="20" y="66" font-family="DejaVu Serif, Noto Serif, serif" font-size="17" fill="#1b1a16">WhaleTale</text>
  <text x="20" y="82" font-size="10.5" fill="#5c584e">Cedar Street Market</text>
  <rect x="10" y="98" width="130" height="24" fill="#2f4f4f" fill-opacity="0.10"/>
  <text x="20" y="114" font-size="12" fill="#1b1a16">Overview</text>
  <text x="20" y="144" font-size="12" fill="#5c584e">Schedule</text>
  <text x="20" y="170" font-size="12" fill="#5c584e">Spaces</text>
  <text x="20" y="196" font-size="12" fill="#5c584e">Occupants</text>
  <text x="20" y="222" font-size="12" fill="#5c584e">Reports</text>
  <text x="20" y="248" font-size="12" fill="#5c584e">Settings</text>

  <!-- header -->
  <text x="184" y="74" font-family="DejaVu Serif, Noto Serif, serif" font-size="25" fill="#1b1a16">Overview</text>
  <text x="184" y="94" font-size="11.5" fill="#5c584e">Mon Jun 2 – Sun Jun 8 · America/Chicago</text>

  <!-- health strip -->
  <line x1="184" y1="112" x2="992" y2="112" stroke="#d7d3c8"/>
  <line x1="184" y1="168" x2="992" y2="168" stroke="#d7d3c8"/>
  <text x="184" y="132" font-size="9.5" fill="#5c584e">SITE ENTRIES</text>
  <text x="184" y="152" font-size="13" fill="#1b1a16">3,481 entries</text>
  <text x="286" y="152" font-size="10" fill="#5c584e">+6%</text>
  <text x="360" y="132" font-size="9.5" fill="#5c584e">EDGE BOXES</text>
  <text x="360" y="152" font-size="13" fill="#1b1a16">1 of 1 reporting</text>
  <text x="530" y="132" font-size="9.5" fill="#5c584e">CAMERAS OFFLINE</text>
  <text x="530" y="152" font-size="13" fill="#b23a26">cam-c</text>
  <path d="M600 145 l6 10 h-12 z" fill="none" stroke="#b23a26" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="614" y="152" font-size="10" fill="#b23a26">attention</text>
  <text x="770" y="132" font-size="9.5" fill="#5c584e">VACANT SPACES</text>
  <text x="770" y="152" font-size="13" fill="#1b1a16">1 of 6</text>

  <!-- table -->
  <text x="184" y="204" font-family="DejaVu Serif, Noto Serif, serif" font-size="15" fill="#1b1a16">Spaces by capture rate</text>
  <text x="184" y="222" font-size="10.5" fill="#5c584e">Capture rate separates appeal from location: a stall on a dead corridor with a high rate is a good tenant in a bad spot.</text>

  <g font-size="10.5" fill="#5c584e">
    <text x="184" y="250">SPACE</text>
    <text x="420" y="250">OCCUPANT</text>
    <text x="712" y="250" text-anchor="end">ENTRIES · WK</text>
    <text x="838" y="250" text-anchor="end">CAPTURE</text>
    <text x="984" y="250" text-anchor="end">VS PRIOR</text>
  </g>
  <line x1="184" y1="258" x2="992" y2="258" stroke="#d7d3c8"/>

  <g font-size="12.5" fill="#1b1a16" font-family="Noto Sans, DejaVu Sans, Helvetica, Arial, sans-serif">
    <!-- row 1 -->
    <text x="184" y="284">Stall 1 <tspan fill="#5c584e" font-size="10.5">stall</tspan></text>
    <text x="420" y="284">Rosa's Tamales</text>
    <text x="712" y="284" text-anchor="end">612</text>
    <text x="838" y="284" text-anchor="end">71%</text>
    <text x="984" y="284" text-anchor="end" fill="#5c584e">+9%</text>
    <line x1="184" y1="296" x2="992" y2="296" stroke="#d7d3c8"/>
    <!-- row 2 -->
    <text x="184" y="322">Stall 2 <tspan fill="#5c584e" font-size="10.5">stall</tspan></text>
    <text x="420" y="322">Nguyen Ceramics</text>
    <text x="712" y="322" text-anchor="end">418</text>
    <text x="838" y="322" text-anchor="end">64%</text>
    <text x="984" y="322" text-anchor="end" fill="#5c584e">&#8722;3%</text>
    <line x1="184" y1="334" x2="992" y2="334" stroke="#d7d3c8"/>
    <!-- row 3 -->
    <text x="184" y="360">Patio 1 <tspan fill="#5c584e" font-size="10.5">patio</tspan></text>
    <text x="420" y="360">Vetiver &amp; Ash</text>
    <text x="712" y="360" text-anchor="end">377</text>
    <text x="838" y="360" text-anchor="end">58%</text>
    <text x="984" y="360" text-anchor="end" fill="#5c584e">+14%</text>
    <line x1="184" y1="372" x2="992" y2="372" stroke="#d7d3c8"/>
    <!-- row 4 -->
    <text x="184" y="398">Stall 4 <tspan fill="#5c584e" font-size="10.5">stall</tspan></text>
    <text x="420" y="398">Handbound Books</text>
    <text x="712" y="398" text-anchor="end">291</text>
    <text x="838" y="398" text-anchor="end">44%</text>
    <text x="984" y="398" text-anchor="end" fill="#5c584e">&#8722;6%</text>
    <line x1="184" y1="410" x2="992" y2="410" stroke="#d7d3c8"/>
    <!-- row 5 vacant -->
    <text x="184" y="436">Stall 6 <tspan fill="#5c584e" font-size="10.5">stall</tspan></text>
    <rect x="420" y="426" width="16" height="12" fill="url(#hatch)" stroke="#d7d3c8"/>
    <text x="442" y="436" fill="#5c584e" font-size="11">vacant</text>
    <text x="712" y="436" text-anchor="end">201</text>
    <text x="838" y="436" text-anchor="end">31%</text>
    <text x="984" y="436" text-anchor="end" fill="#5c584e">new</text>
  </g>

  <text x="184" y="478" font-size="10" fill="#5c584e" font-style="italic">Rendering of the operator console. Working-drawing visual world (see DESIGN.md); demo site data.</text>
</svg>
