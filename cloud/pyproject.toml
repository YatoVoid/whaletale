[project]
name = "whaletale-cloud"
version = "0.2.0"
description = "WhaleTale cloud: schema, attribution join, metrics, normalization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "whaletale-shared",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "shapely>=2.0.6",
    "jinja2>=3.1.4",
    "sentry-sdk>=2.18.0",
    "stripe>=11.1.0",
    "weasyprint>=63.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.6",
    "mypy>=1.14.0",
    "testcontainers[postgres]>=4.9.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
whaletale-report = "whaletale_cloud.report_cli:main"
whaletale-api = "whaletale_cloud.api.run:main"

[tool.uv]
package = true

[tool.uv.sources]
whaletale-shared = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["whaletale_cloud"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI puts Query/Depends/Header calls in argument defaults by design.
"whaletale_cloud/api/**" = ["B008"]
# Alembic autogenerates these; long DDL lines and its own import order are fine.
"migrations/versions/*" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "whaletale_cloud"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["whaletale_cloud", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient warns to switch to httpx2 (not yet stable).
    "ignore:Using .httpx. with .starlette.testclient.",
]

[tool.coverage.run]
# Runtime wiring / entrypoints, exercised by the running app, not units.
omit = [
    "tests/*",
    "migrations/*",
    "whaletale_cloud/db.py",
    "whaletale_cloud/report_cli.py",
    "whaletale_cloud/api/run.py",
]
