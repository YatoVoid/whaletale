[project]
name = "whaletale-shared"
version = "0.2.0"
description = "WhaleTale shared schemas: the single source of truth for cross-service types"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic[email]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["schemas"]
